# AI Control Layer stack. Owner: Maciej (Dev D). Spec: docs/tasks/grzegorz/A7-compose-i-audyt-dlugu.md §3.
# Run: docker compose up --build. Proxy on 127.0.0.1:8080; Ollama reachable only inside the Compose network (D01).
name: control-layer

services:
  app:
    build:
      context: .
      target: final
    ports:
      - "127.0.0.1:8080:8080"           # host loopback only
    environment:
      CONTROL_LAYER_POLICY: /app/config/policy.compose.yaml
      CONTROL_LAYER_AUDIT: /app/var/audit.jsonl
      CONTROL_LAYER_FEED: /app/signatures/feed.yaml
      CONTROL_LAYER_GUARD_URL: http://ollama:11434   # guard models (B6); the default 127.0.0.1 is the container itself
    volumes:
      - ./config:/app/config:ro          # a DIRECTORY, not the file: editors save by rename, polling must see it
      - ./signatures:/app/signatures:ro  # same for the signature feed (demo W2 edits it live)
      - audit-data:/app/var              # named volume keeps appuser (UID 10001) ownership on any host
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.3
    volumes:
      - ollama-models:/root/.ollama
    # No `ports:` on purpose (D01). EXPOSE 11434 in the image does not publish it on the host.
    healthcheck:
      test: ["CMD", "ollama", "list"]    # the image has no curl
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.32.3
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Must list every model in policy.compose.yaml `models:` (and the guard model once a guard control is enabled),
      # otherwise the semantic control fails closed. Not OLLAMA_MODELS: that is Ollama's model directory.
      PULL_MODELS: ${PULL_MODELS:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['for m in $$PULL_MODELS; do ollama pull "$$m" || exit 1; done']
    restart: "no"

volumes:
  ollama-models:
  audit-data:
