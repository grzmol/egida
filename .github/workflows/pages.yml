name: Docs (GitHub Pages)

# Publishes site/ (static, no build step). Manual only: Pages is not enabled while the repo is
# private (a push trigger failed main). To publish: Settings → Pages → Source: GitHub Actions,
# then Actions → "Docs (GitHub Pages)" → Run workflow. The published site is public.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
