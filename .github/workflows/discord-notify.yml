name: Discord notify

on: push

permissions:
  contents: read  # checkout: the task progress is read from docs/tasks/*/README.md

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ping Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE: ${{ github.event.compare }}
          REPO: ${{ github.repository }}
        run: |
          # Per-person and overall share of tasks marked done (☑ = 1, ◐ = 0.5) at this commit.
          PROGRESS="$(python3 scripts/task_progress.py)"
          # Webhooks only parse user mentions by default; allowed_mentions enables @everyone.
          jq -n --argjson c "$COMMITS" --arg pusher "$PUSHER" \
                --arg compare "$COMPARE" --arg repo "$REPO" --arg progress "$PROGRESS" '{
            content: "@everyone 🐸 Fresh code on `main` — run `git pull`!",
            allowed_mentions: { parse: ["everyone"] },
            embeds: [{
              title: "🚀 \($c | length) new commit(s) in \($repo)",
              url: $compare,
              color: 5763719,
              description: (
                if ($c | length) == 0 then "Force push / branch reset."
                else [ $c[] | "[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0]) — \(.author.name)" ]
                     | join("\n") | .[0:4000] end),
              footer: { text: "Pushed by \($pusher) · git pull origin main" },
              timestamp: (now | todate)
            },
            {
              title: "📊 Postęp zadań (docs/tasks)",
              color: 15844367,
              description: $progress
            }]
          }' | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
