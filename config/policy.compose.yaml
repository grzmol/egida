# Compose copy of config/policy.yaml. Owner: Maciej (Dev D).
# Differs ONLY in upstreams (Ollama by service name) and timeouts; tests/unit/deploy guards parity.
# In Docker Compose edit THIS file (mounted as a directory, hot reload works).
# AI Control Layer — policy v1 (schema: src/control_layer/core/policy.py, ADR-0003).
# Edited live: changes apply without restart; an invalid file is rejected and the last valid policy stays.
version: 1

defaults:
  on_error: block        # what a control does when it fails or times out (fail-closed)
  timeout_ms: 1500

limits:
  max_input_chars: 100000
  max_messages: 100
  max_tokens: 1024       # requested max_tokens is clamped to this

upstreams:
  ollama:
    base_url: http://ollama:11434/v1
    timeout_s: 60

models:
  llama3.2:3b:
    upstream: ollama
    price_in_per_1k: 0.0002    # local compute is priced too (budget governance)
    price_out_per_1k: 0.0006

agents:
  demo-agent:
    key_sha256: 337d3b58b003feda566bd8b4a36d7cdb732ec597f01fe52542cbfd873b1c7ba0   # sha256("sk-demo-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: []
    budget: default

budgets:
  default:
    max_tokens: 50000
    max_cost: 1.0
    max_requests: 300
    window_s: 3600
    max_identical: 5         # identical requests within identical_window_s = agent loop
    identical_window_s: 10

# Controls run in this order (cheap first). A control missing from this list is disabled.
controls: []
