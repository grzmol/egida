# Compose copy of config/policy.yaml. Owner: Maciej (Dev D).
# Differs ONLY in upstreams (Ollama by service name) and timeouts; tests/unit/deploy guards parity.
# In Docker Compose edit THIS file (mounted as a directory, hot reload works).
# Egida: policy v1 (schema: src/egida/core/policy.py, ADR-0003).
# Edited live: changes apply without restart; an invalid file is rejected and the last valid policy stays.
version: 1

defaults:
  on_error: block        # what a control does when it fails or times out (fail-closed)
  timeout_ms: 1500

limits:
  max_input_chars: 100000
  max_messages: 100
  max_tokens: 1024       # requested max_tokens is clamped to this

upstreams:
  ollama:
    base_url: http://ollama:11434/v1
    timeout_s: 60

models:
  llama3.2:3b:
    upstream: ollama
    price_in_per_1k: 0.0002    # local compute is priced too (budget governance)
    price_out_per_1k: 0.0006

agents:
  demo-agent:
    key_sha256: 337d3b58b003feda566bd8b4a36d7cdb732ec597f01fe52542cbfd873b1c7ba0   # sha256("sk-demo-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: []
    budget: default
  ci-agent:                    # second agent: own key and a much smaller budget (limits per agent)
    key_sha256: 327f34df0219d1f894d2b0ac3db43467a29fd76d4d65f6c499c32c8bce0b39d7   # sha256("sk-ci-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: []
    budget: small
  selftest-agent:              # `make selftest` runs as this agent, so it never eats demo-agent's budget
    key_sha256: bb0ea463317a34f119abfa77b4c4026653bf4b835b80a8619852dab53909767d   # sha256("sk-selftest-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: []          # same permissions as demo-agent: cases expect its decisions
    budget: selftest
  tools-agent:                 # demo agent with tools (scripts/demo_agent.py, tests/cases/tools-indirect.yaml)
    key_sha256: 354fda1a4001f25735fa24a64e3f12054efbfdf4a94463758357639159a22b9e   # sha256("sk-tools-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: [search_docs, read_file, http_get]   # delete_file deliberately missing (ACL scene)
    budget: default
  sig-probe-agent:             # selftest probes: feed rule cases and cases with arbitrary tool names
    key_sha256: f9cf298d42631a639f1819067a9b4551aa5f27b819cc41cd7de1b453626cd90c   # sha256("sk-sig-probe-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: ["*"]       # probes use unique tool names (sig_probe_*)
    budget: default
  bench-agent:                 # make bench only: its own budget so a load run never touches the demo
    key_sha256: 964111b82a664af4af4767424f6b93858838c047c85dabee1263ed07a5d304f8   # sha256("sk-bench-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: []
    budget: bench

budgets:
  default:
    max_tokens: 50000
    max_cost: 1.0
    max_requests: 300
    window_s: 3600
    max_identical: 5         # identical requests within identical_window_s = agent loop
    identical_window_s: 10
  small:
    max_tokens: 5000
    max_cost: 0.05
    max_requests: 30
    window_s: 3600
    max_identical: 3
    identical_window_s: 10
  selftest:                    # ~140 requests per selftest run; loop detection as in default
    max_tokens: 2000000
    max_cost: 50.0
    max_requests: 2000
    window_s: 3600
    max_identical: 5
    identical_window_s: 10
  bench:
    max_tokens: 10000000
    max_cost: 1000.0
    max_requests: 100000
    window_s: 3600
    max_identical: 1000
    identical_window_s: 10

# Controls run in this order (cheap first). A control missing from this list is disabled.
controls:
  - id: signatures             # R4/C10/C11/C18: known-attack feed signatures/feed.yaml, hot reloaded
    kind: signature
    sides: [input, output]
    action: block
    threshold: 0.5             # severity filter: medium and above decide, low stays in the audit
    on_error: block
    timeout_ms: 300
    params: {rule_action: block, disabled_rules: []}
  - id: pii                    # C04: e-mail, phone, PESEL, NIP, IBAN, card (checksums)
    kind: pii
    sides: [input, output]
    action: redact
    threshold: 0.5
  - id: secrets                # C05: cloud/API keys, private keys, JWT, connection strings
    kind: secrets
    sides: [input, output]
    action: block
    threshold: 0.8
  - id: injection_heuristics   # C06: EN/PL phrase rules after normalization (homoglyphs, base64)
    kind: injection_heuristics
    sides: [input]
    action: block
    threshold: 0.5
  - id: canary                 # C22: the system-prompt canary the pipeline injects leaks in the output
    kind: canary
    sides: [output]
    action: block
    threshold: 0.5
  - id: egress.tool            # C14: tool-call arguments with URLs outside the allowlist (exfiltration)
    kind: egress
    enabled: false             # until tests/cases/tools-indirect.yaml (B7): the runner cannot fake tool_calls yet
    sides: [output]
    action: block              # blocking output controls before redacting ones: precise blocked_by
    threshold: 0.5
    params: {allowed_domains: [bank.example, docs.python.org], scan: [tool_arguments]}
  - id: egress                 # C14: markdown images/links and URLs with data in the answer
    kind: egress
    sides: [output]
    action: redact
    threshold: 0.5
    params: {allowed_domains: [bank.example, docs.python.org], scan: [content]}
  - id: prompt_guard           # C07: Llama Prompt Guard 2 86M (ONNX). Needs `make models`.
    kind: prompt_guard
    enabled: false             # decision at Sync 3 (18:00)
    sides: [input]
    action: block
    threshold: 0.95
    timeout_ms: 800
