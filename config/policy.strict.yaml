# STRICT sample policy (deliverable "Sample Configuration"). Same schema as policy.yaml.
# Run: CONTROL_LAYER_POLICY=config/policy.strict.yaml make run
# Differences from policy.yaml: everything blocks (no redaction), lower thresholds,
# prompt_guard on, tighter limits and budgets, a loop after 3 identical requests.
version: 1

defaults:
  on_error: block
  timeout_ms: 1000

limits:
  max_input_chars: 20000
  max_messages: 40
  max_tokens: 512

upstreams:
  ollama:
    base_url: http://127.0.0.1:11434/v1
    timeout_s: 30

models:
  llama3.2:3b:
    upstream: ollama
    price_in_per_1k: 0.0002
    price_out_per_1k: 0.0006

agents:
  demo-agent:
    key_sha256: 337d3b58b003feda566bd8b4a36d7cdb732ec597f01fe52542cbfd873b1c7ba0   # sha256("sk-demo-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: []
    budget: default
  ci-agent:
    key_sha256: 327f34df0219d1f894d2b0ac3db43467a29fd76d4d65f6c499c32c8bce0b39d7   # sha256("sk-ci-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: []
    budget: small
  selftest-agent:
    key_sha256: bb0ea463317a34f119abfa77b4c4026653bf4b835b80a8619852dab53909767d   # sha256("sk-selftest-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: []
    budget: selftest
  tools-agent:
    key_sha256: 354fda1a4001f25735fa24a64e3f12054efbfdf4a94463758357639159a22b9e   # sha256("sk-tools-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: [search_docs, read_file, http_get]
    budget: default
  sig-probe-agent:
    key_sha256: f9cf298d42631a639f1819067a9b4551aa5f27b819cc41cd7de1b453626cd90c   # sha256("sk-sig-probe-agent")
    allowed_models: [llama3.2:3b]
    allowed_tools: ["*"]
    budget: default

budgets:
  default:
    max_tokens: 20000
    max_cost: 0.25
    max_requests: 100
    window_s: 3600
    max_identical: 3
    identical_window_s: 30
  small:
    max_tokens: 2000
    max_cost: 0.02
    max_requests: 10
    window_s: 3600
    max_identical: 2
    identical_window_s: 30
  selftest:
    max_tokens: 2000000
    max_cost: 50.0
    max_requests: 2000
    window_s: 3600
    max_identical: 3
    identical_window_s: 30

controls:
  - id: signatures
    kind: signature
    sides: [input, output]
    action: block
    threshold: 0.25            # strict: low-severity rules decide too
    on_error: block
    timeout_ms: 300
    params: {rule_action: block, disabled_rules: []}
  - id: pii
    kind: pii
    sides: [input, output]
    action: block              # strict: personal data never leaves, even masked
    threshold: 0.5
  - id: secrets
    kind: secrets
    sides: [input, output]
    action: block
    threshold: 0.5             # also blocks high-entropy strings (score 0.6)
  - id: injection_heuristics
    kind: injection_heuristics
    sides: [input]
    action: block
    threshold: 0.5             # mixed-script words (score 0.6) count too
  - id: egress.tool
    kind: egress
    enabled: false             # until tests/cases/tools-indirect.yaml (B7)
    sides: [output]
    action: block
    threshold: 0.5
    params: {allowed_domains: [bank.example, docs.python.org], scan: [tool_arguments]}
  - id: egress
    kind: egress
    sides: [output]
    action: redact
    threshold: 0.5
    params: {allowed_domains: [bank.example, docs.python.org], scan: [content], links: all}   # strict: every outside link, not only links with data
  - id: prompt_guard
    kind: prompt_guard
    sides: [input]
    action: block
    threshold: 0.8
    timeout_ms: 800            # model missing or slow: on_error block (fail-closed)
