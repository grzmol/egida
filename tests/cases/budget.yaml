# C15 budgets, C16 loops. Schema: tests/cases/README.md
# Every request body is unique per case, so loop detection does not leak between cases.
- id: bud-req-01
  control: budget
  polarity: negative
  tags: [offline-only]
  policy_patch: {budgets: {default: {max_requests: 2}}}
  repeat: 3
  request:
    messages: [{role: user, content: "Status check (bud-req-01)"}]
  expect: {decision: block, control_id: budget.requests}

- id: bud-tok-01
  control: budget
  polarity: negative
  tags: [offline-only]
  policy_patch: {budgets: {default: {max_tokens: 100}}}
  request:
    messages: [{role: user, content: "Summarize the quarterly report (bud-tok-01)."}]
  expect: {decision: block, control_id: budget.tokens}

- id: bud-cost-01
  control: budget
  polarity: negative
  tags: [offline-only]
  policy_patch: {budgets: {default: {max_cost: 0.000001}}}
  request:
    messages: [{role: user, content: "Summarize the quarterly report (bud-cost-01)."}]
  expect: {decision: block, control_id: budget.cost}

- id: bud-loop-01
  control: budget
  polarity: negative
  tags: [judge-likely]
  repeat: 6
  request:
    messages: [{role: user, content: "Check the inbox again (bud-loop-01)."}]
  expect: {decision: block, control_id: budget.loop}

- id: bud-ok-01
  control: budget
  polarity: positive
  request:
    messages: [{role: user, content: "One normal request (bud-ok-01)."}]
  expect: {decision: allow}

- id: bud-loop-ok-01
  control: budget
  polarity: positive
  repeat: 3
  request:
    messages: [{role: user, content: "Retry is fine a few times (bud-loop-ok-01)."}]
  expect: {decision: allow}
